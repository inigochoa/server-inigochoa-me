name: Build and Deploy

# This repository does not host source code. It only builds the site
# whose source lives on Codeberg and publishes the result to GitHub Pages.
# The build is triggered by hand from the Actions tab, never automatically.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Store the cache_id env variable
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - name: Use cache
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      - name: Clone site source from Codeberg
        run: |
          git clone --depth 1 https://codeberg.org/inigochoa/server-inigochoa-me.git .

      - name: Install required dependencies
        run: pip install properdocs mkdocs-materialx mkdocs-document-dates mkdocs-minify-plugin cairosvg pillow

      - name: Build site
        run: properdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
